plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omar.carlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.omar.carlauncher"
        minSdk 29
        targetSdk 29
        versionCode 7
        versionName "1.0.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
